
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.niraj.coinapp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.niraj.coinapp'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.unity3d.ads:unity-ads:4.22.0'
}
